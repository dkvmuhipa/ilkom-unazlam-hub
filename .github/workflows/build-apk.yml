name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK for Easy Identification
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ilkom-unazlam-hub-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ilkom-unazlam-hub-apk
          path: ilkom-unazlam-hub-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Release v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### 🎓 ILKOM UNAZLAM HUB - Android APK Release
            Build otomatis berhasil dikompilasi oleh GitHub Actions.
            
            **Fitur Utama:**
            - Presensi QR Code Real-time (ISO standard) & Countdown Timer 15 Menit.
            - Gudang Materi & E-Book Kuliah.
            - Manajemen Kelompok & Sub-Tugas Mahasiswa.
            - Generator Surat Izin & Dispensasi Kuliah (WhatsApp & Copy).
            - Musyawarah & Voting Kelas Interaktif.
            - Manajemen Kas & Notifikasi Terpadu.
            
            Silakan unduh file `.apk` di bawah ini dan instal di perangkat Android Anda.
          files: |
            ilkom-unazlam-hub-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
